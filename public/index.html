<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Studio AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #060810; --surface: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.08); --blue: #2563eb; --blue-dim: rgba(37,99,235,0.15); --blue-border: rgba(37,99,235,0.35); --text: #f0f0f0; --muted: #6b7280; --green: #22c55e; --mono: 'DM Mono', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; padding: 32px 20px 80px; }
        .page { max-width: 760px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 48px; }
        .badge { display: inline-flex; align-items: center; gap: 8px; background: var(--blue-dim); border: 1px solid var(--blue-border); border-radius: 100px; padding: 5px 16px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: #93c5fd; margin-bottom: 18px; }
        h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(38px, 7vw, 64px); font-weight: 900; letter-spacing: -.02em; line-height: 1; }
        h1 em { font-style: normal; color: var(--blue); }
        .subtitle { margin-top: 10px; color: var(--muted); font-size: 14px; font-family: var(--mono); }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; margin-bottom: 20px; }
        .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .step-pill { background: var(--blue-dim); border: 1px solid var(--blue-border); border-radius: 100px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #93c5fd; flex-shrink: 0; }
        .card-title { font-size: 16px; font-weight: 600; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .field input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; font-family: 'Barlow', sans-serif; outline: none; transition: border-color .2s, background .2s; }
        .field input:focus { border-color: var(--blue-border); background: rgba(37,99,235,0.05); }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 500px) { .row2 { grid-template-columns: 1fr; } }
        .color-row { display: flex; align-items: center; gap: 12px; }
        .color-swatch { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--border); overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .color-swatch input { width: 200%; height: 200%; margin: -50%; border: none; cursor: pointer; }
        .color-info { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; }
        .logo-drop { position: relative; border: 1.5px dashed rgba(255,255,255,0.12); border-radius: 12px; padding: 22px; text-align: center; cursor: pointer; transition: all .2s; }
        .logo-drop:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.02); }
        .logo-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        .logo-drop.ready { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.04); }
        .logo-preview { max-height: 56px; max-width: 160px; object-fit: contain; margin: 0 auto 6px; display: none; border-radius: 6px; }
        .logo-drop.ready .logo-preview { display: block; }
        .logo-hint { font-family: var(--mono); font-size: 11px; color: var(--muted); }
        .logo-icon { font-size: 26px; margin-bottom: 6px; }
        .btn-primary { width: 100%; padding: 16px; background: var(--blue); border: none; border-radius: 12px; color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; transition: all .2s; margin-top: 8px; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(37,99,235,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { flex: 1; padding: 10px 14px; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; font-family: 'Barlow', sans-serif; }
        .btn-secondary:hover { border-color: rgba(255,255,255,0.25); color: #fff; background: rgba(255,255,255,0.04); }
        .btn-pdf { width: 100%; padding: 16px; background: linear-gradient(135deg, #1e40af, #1d4ed8); border: none; border-radius: 12px; color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; transition: all .2s; box-shadow: 0 4px 24px rgba(37,99,235,0.3); }
        .btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 8px 40px rgba(37,99,235,0.5); }
        .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); border-radius: 10px; padding: 12px 16px; color: #fca5a5; font-size: 13px; margin-top: 12px; display: none; }
        #loading-view { display: none; min-height: 80vh; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
        .spinner { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(37,99,235,0.2); border-top-color: var(--blue); animation: spin .85s linear infinite; margin-bottom: 28px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .load-title { font-family
